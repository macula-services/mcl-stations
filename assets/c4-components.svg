<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-label="mcl-stations components">
<title>mcl-stations components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="1040"/>
<rect class="bound" x="16" y="40" width="1168" height="730" rx="12"/>
<text class="t-bound" x="32" y="62">mcl-stations [Container: one OTP release]</text>
<rect class="b-cmp" x="40" y="66" width="480" height="120" rx="10"/>
<text class="t-code" x="56" y="94">mcl_stations_app</text>
<text class="t-type" x="56" y="112">[application behaviour]</text>
<text class="t-desc" x="56" y="136">start/2 called mcl_om:boot/1 with this service:</text>
<text class="t-desc" x="56" y="152">the mesh, the identity, health and list_stations</text>
<text class="t-desc" x="56" y="168">are wired before start/1 runs</text>
<rect class="b-cmp" x="660" y="66" width="500" height="120" rx="10"/>
<text class="t-code" x="676" y="94">mcl_stations_service</text>
<text class="t-type" x="676" y="112">[mcl_om_service behaviour]</text>
<text class="t-desc" x="676" y="136">The six callbacks. data_dir/0 is private and not exported;</text>
<text class="t-desc" x="676" y="152">start/1 opens the read model first; capabilities/0</text>
<text class="t-desc" x="676" y="168">advertises list_stations; mcl_om adds info, get_limits</text>
<rect class="b-cmp" x="40" y="210" width="480" height="104" rx="10"/>
<text class="t-code" x="56" y="238">mcl_stations_sup</text>
<text class="t-type" x="56" y="256">[supervisor, one_for_one]</text>
<text class="t-desc" x="56" y="280">One child, ingest_node_records:</text>
<text class="t-desc" x="56" y="296">the directory has one feeder</text>
<rect class="b-cmp" x="660" y="210" width="500" height="120" rx="10"/>
<text class="t-code" x="676" y="238">list_stations</text>
<text class="t-type" x="676" y="256">[macula_response RPC provider]</text>
<text class="t-desc" x="676" y="280">handle_request/2 folds the read model, applies</text>
<text class="t-desc" x="676" y="296">the filters, sorts by distance and caps the</text>
<text class="t-desc" x="676" y="312">count; every stored record is verified again</text>
<rect class="b-cmp" x="40" y="338" width="480" height="120" rx="10"/>
<text class="t-code" x="56" y="366">ingest_node_records</text>
<text class="t-type" x="56" y="384">[gen_server, the feeder]</text>
<text class="t-desc" x="56" y="408">Snapshot then subscribe: node_record,</text>
<text class="t-desc" x="56" y="424">station_endpoint and tombstone. Monitors the</text>
<text class="t-desc" x="56" y="440">pool, redials when it restarts, polls its links</text>
<rect class="b-cmp" x="660" y="338" width="500" height="120" rx="10"/>
<text class="t-code" x="676" y="366">station_record_drops</text>
<text class="t-type" x="676" y="384">[ETS gauge]</text>
<text class="t-desc" x="676" y="408">Keyed by (row, record type): what the directory</text>
<text class="t-desc" x="676" y="424">is refusing right now, per reason. Health reads</text>
<text class="t-desc" x="676" y="440">the counts, so a directory dropping rows is not green</text>
<rect class="b-cmp" x="40" y="482" width="480" height="120" rx="10"/>
<text class="t-code" x="56" y="510">station_read_model</text>
<text class="t-type" x="56" y="528">[barrel_docdb]</text>
<text class="t-desc" x="56" y="552">One doc per station key id, holding each</text>
<text class="t-desc" x="56" y="568">record's raw signed bytes and projected fields;</text>
<text class="t-desc" x="56" y="584">expiry and serving are per record type</text>
<rect class="b-cmp" x="660" y="482" width="480" height="120" rx="10"/>
<text class="t-code" x="676" y="510">continent_lookup</text>
<text class="t-type" x="676" y="528">[pure, a static table]</text>
<text class="t-desc" x="676" y="552">ISO 3166-1 alpha-2 country code to</text>
<text class="t-desc" x="676" y="568">continent; anything else is unknown</text>
<rect class="b-mac" x="40" y="626" width="360" height="120" rx="10"/>
<text class="t-code" x="56" y="654">mcl_om</text>
<text class="t-type" x="56" y="672">[library, ~&gt; 1.0]</text>
<text class="t-desc" x="56" y="696">boot/1 wires mesh, identity, health;</text>
<text class="t-desc" x="56" y="712">it advertises capabilities/0</text>
<rect class="b-mac" x="420" y="626" width="360" height="120" rx="10"/>
<text class="t-code" x="436" y="654">macula</text>
<text class="t-type" x="436" y="672">[library, ~&gt; 15.6]</text>
<text class="t-desc" x="436" y="696">find_records_by_type/2, subscribe_records/3,</text>
<text class="t-desc" x="436" y="712">record verification under the crypto profile</text>
<rect class="b-mac" x="800" y="626" width="360" height="120" rx="10"/>
<text class="t-code" x="816" y="654">barrel_docdb</text>
<text class="t-type" x="816" y="672">[library, ~&gt; 1.5]</text>
<text class="t-desc" x="816" y="696">the read model's store, on the rocksdb</text>
<text class="t-desc" x="816" y="712">binding linked to the system librocksdb 11.1</text>
<rect class="b-ext" x="40" y="800" width="1120" height="104" rx="10"/>
<text class="t-code" x="56" y="828">the host environment</text>
<text class="t-type" x="56" y="846">[environment, read at boot]</text>
<text class="t-desc" x="56" y="870">MCL_REALM, MCL_REALM_KEY, MACULA_STATION_SEEDS, MACULA_STATION_NODE_IDS (mcl_om refuses to boot without them), MCL_DATA_DIR (/var/lib/mcl-stations);</text>
<text class="t-desc" x="56" y="886">the node identity key is read from /etc/mcl/secrets by mcl_om; nothing here is a secret</text>
<path class="edge" d="M520 126H660" marker-end="url(#a)"/>
<text class="t-rel" x="590" y="118" text-anchor="middle">boots</text>
<path class="edge" d="M660 150H580V262H520" marker-end="url(#a)"/>
<text class="t-rel" x="588" y="216">start/1</text>
<path class="edge" d="M915 186V210" marker-end="url(#a)"/>
<text class="t-rel" x="923" y="206">advertises</text>
<path class="edge" d="M285 314V338" marker-end="url(#a)"/>
<text class="t-rel" x="293" y="334">supervises</text>
<path class="edge" d="M285 458V482" marker-end="url(#a)"/>
<text class="t-rel" x="293" y="478">upserts, retires</text>
<path class="edge" d="M915 314V338" marker-end="url(#a)"/>
<text class="t-rel" x="923" y="328">observes a refusal</text>
<path class="edge" d="M660 262H620V542H520" marker-end="url(#a)"/>
<text class="t-rel" x="528" y="420">folds a row</text>
<path class="edge" d="M520 570H660" marker-end="url(#a)"/>
<text class="t-rel" x="528" y="562">continent_of/1</text>
<text class="t-desc" x="40" y="934">The read model is a cache: it lives and dies with the container, and every boot replays the DHT snapshot into it. A stored record is verified</text>
<text class="t-desc" x="40" y="952">again before it is served; one that fails is refused, counted in station_record_drops, and /health turns degraded. The three libraries</text>
<text class="t-desc" x="40" y="970">are drawn without arrows: every module here reaches the mesh through mcl_om or macula, and the store through barrel_docdb.</text>
<rect class="b-sys" x="24" y="994" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="1006">In scope</text>
<rect class="b-per" x="110.8" y="994" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="1006">Person</text>
<rect class="b-mac" x="184.39999999999998" y="994" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="1006">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="994" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="1006">External system</text>
<rect class="b-cmp" x="490.0" y="994" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="1006">Container or component</text>
<rect class="bound" x="669.2" y="994" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="1006">Boundary</text>
</svg>
