# Structural lint and unit tests. Runs on the glibc macula-ci-otp image, where macula
# resolves a prebuilt QUIC NIF -- but macula_cbor_nif (and the crypto/ucan/did/
# mri NIFs beside it) have no such fallback and ALWAYS build from source, so a
# Rust toolchain is needed here too or `rebar3 compile' fails in the
# macula_cbor_nif hook before a single test runs (its build script refuses to
# silently skip, because a package that compiles clean and fails every caller
# at runtime with nif_not_loaded is worse). The alpine image build forces a
# source build for everything including macula_quic; see the Containerfile.

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # ⚠ MUST MATCH THE `Containerfile' beside it: OTP 28.4.3. This said
      # `erlang:28', which floats, as did the Containerfile, and the deploy
      # after Docker Hub moved them shipped 28.5. The dated macula-ci-otp tag
      # is macula-io/macula-ci-images' build (OTP 28.4.3, an OpenSSL with
      # ML-DSA, rebar3, Rust, cmake); the step below refuses anything else.
      # mcl_stations_service_tests guards both pins.
      # macula-ci-otp plus librocksdb 11.1.2 and the codec dev libs, for the
      # rocksdb override in rebar.config: the same build image as the
      # Containerfile's builder.
      image: ghcr.io/macula-io/macula-ci-otp-rocksdb@sha256:da4ea316b91f4f29efc8036fa9d95a3b1f3efde8b85cb5997780f140e0f2f6d8
    steps:
      - uses: actions/checkout@v4
      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
      # cmake, build-essential: mcl_om pulls in rocksdb (via barrel_docdb)
      # and khepri/ra transitively, UNCONDITIONALLY -- needed even for a
      # storeless, producer-only service. libssl-dev is not listed because
      # the debian-based erlang image already ships it; alpine (the
      # Containerfile's runtime base) does not, which is why it's explicit
      # there.
      #
      - run: rebar3 lint
      - run: rebar3 eunit
      - run: rebar3 dialyzer
